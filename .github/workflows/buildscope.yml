name: Buildscope
on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang g++
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja llvm gcc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          for compiler in "$(brew --prefix gcc)"/bin/g++-*; do
            if [ -x "$compiler" ]; then
              echo "BUILDSCOPE_TEST_GCC=$compiler" >> "$GITHUB_ENV"
              break
            fi
          done
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --nocapture
      - run: node --check src/web/app.js
      - run: node --check src/web/tour.js
      - run: node --test tests/tour.test.cjs
      - run: cargo build --release --locked

  compatibility:
    name: Clang ${{ matrix.toolchain.clang }} / GCC ${{ matrix.toolchain.gcc }} / Ninja ${{ matrix.ninja.version }}
    runs-on: ${{ matrix.toolchain.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - { os: ubuntu-22.04, clang: "14", gcc: "11" }
          - { os: ubuntu-24.04, clang: "18", gcc: "13" }
          - { os: ubuntu-24.04, clang: "20", gcc: "14" }
        ninja:
          - version: "1.11.1"
            sha256: b901ba96e486dce377f9a070ed4ef3f79deb45f4ffe2938f8e7ddc69cfb3df77
          - version: "1.12.1"
            sha256: 6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255
          - version: "1.13.2"
            sha256: 5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6
    env:
      CLANG_VERSION: ${{ matrix.toolchain.clang }}
      GCC_VERSION: ${{ matrix.toolchain.gcc }}
      BUILDSCOPE_TEST_CLANG: clang++-${{ matrix.toolchain.clang }}
      BUILDSCOPE_TEST_GCC: g++-${{ matrix.toolchain.gcc }}
      NINJA_VERSION: ${{ matrix.ninja.version }}
      NINJA_SHA256: ${{ matrix.ninja.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install versioned compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake curl unzip "clang-$CLANG_VERSION" "g++-$GCC_VERSION"
      - name: Install pinned Ninja release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/ninja-linux.zip" \
            --output "$RUNNER_TEMP/ninja.zip"
          echo "$NINJA_SHA256  $RUNNER_TEMP/ninja.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/buildscope-ninja"
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/buildscope-ninja"
          chmod +x "$RUNNER_TEMP/buildscope-ninja/ninja"
          echo "$RUNNER_TEMP/buildscope-ninja" >> "$GITHUB_PATH"
      - name: Verify selected tool versions
        run: |
          "$BUILDSCOPE_TEST_CLANG" --version
          "$BUILDSCOPE_TEST_GCC" --version
          cmake --version
          ninja --version
          test "$("$BUILDSCOPE_TEST_CLANG" -dumpversion | cut -d. -f1)" = "$CLANG_VERSION"
          test "$("$BUILDSCOPE_TEST_GCC" -dumpversion | cut -d. -f1)" = "$GCC_VERSION"
          test "$(ninja --version)" = "$NINJA_VERSION"
      - name: Run real-build compatibility tests
        run: cargo test --locked --test workflow -- --nocapture
