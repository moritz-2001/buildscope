[package]
name = "buildscope"
version = "0.1.0"
edition = "2024"
description = "Explain C++ build time with Ninja, Clang, and GCC evidence"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
tar = "0.4"
tiny_http = "0.12"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
